<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebPro — Escolher Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}

    .bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:0.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .bar__title{font-size:0.85rem;font-weight:600;white-space:nowrap}
    .bar__title span{color:#888;font-weight:400}
    .bar__tabs{display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center}
    .bar__tab{padding:0.45rem 1rem;border-radius:8px;border:1.5px solid #333;background:transparent;color:#aaa;font-family:inherit;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.25s;white-space:nowrap}
    .bar__tab:hover{border-color:#555;color:#fff}
    .bar__tab.active{background:#fff;color:#0a0a0a;border-color:#fff}
    .bar__hint{font-size:0.7rem;color:#555;white-space:nowrap}

    .preview{position:fixed;top:56px;left:0;right:0;bottom:0}
    .preview iframe{width:100%;height:100%;border:none;background:#fff}

    @media(max-width:768px){
      .bar{flex-wrap:wrap;justify-content:center;gap:0.5rem;padding:0.6rem 1rem}
      .bar__title{width:100%;text-align:center;font-size:0.8rem}
      .bar__tabs{width:100%;justify-content:center}
      .bar__tab{padding:0.4rem 0.7rem;font-size:0.72rem}
      .bar__hint{display:none}
      .preview{top:100px}
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar__title">WebPro <span>— Escolher Design</span></div>
    <div class="bar__tabs">
      <button class="bar__tab active" data-src="v1-seller.html">1. Direct Seller</button>
      <button class="bar__tab" data-src="v2-studio.html">2. Portfolio Studio</button>
      <button class="bar__tab" data-src="v3-trust.html">3. Trust Builder</button>
      <button class="bar__tab" data-src="v4-minimal.html">4. Modern Minimal</button>
    </div>
    <div class="bar__hint">← clique para trocar</div>
  </div>
  <div class="preview">
    <iframe id="frame" src="v1-seller.html"></iframe>
  </div>
  <script>
    const frame=document.getElementById('frame');
    const tabs=document.querySelectorAll('.bar__tab');
    tabs.forEach(tab=>{
      tab.addEventListener('click',()=>{
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        frame.src=tab.dataset.src;
      });
    });
  </script>
</body>
</html>
